<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Decision tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mali:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1f2933; --soft:#52606d; --board:#f3f6f9; --dot:#c3ccd6; --paper:#fff; --focus:#1d4ed8; --shadow:#cfd8e0;
  --SM:#f6d36b; --AC:#9fd8ab; --OM:#9ee0e0; --OD:#cdbdf0; --GM:#f2989f; --MD:#bcd7fb; --AD:#ffc999; --DEV:#c9e58a; --ALL:#dfe5ec;
  --warn:#9a3412; --good:#0f6b3a;
  --body:'IBM Plex Sans Thai','IBM Plex Sans','Noto Sans','Leelawadee UI',Tahoma,'Segoe UI',Arial,sans-serif;
  --hand:'Mali','Segoe Print','Comic Sans MS',cursive,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:116px}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;font-family:var(--body);color:var(--ink);line-height:1.5;font-size:16px;background-color:var(--board);
  background-image:radial-gradient(var(--dot) 1.3px,transparent 1.4px);background-size:28px 28px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
p{margin:0}
.hidden{display:none!important}

/* top bar */
.bar{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:2px solid var(--ink);display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:8px 18px}
.bar>b{font-family:var(--hand);font-size:17px;white-space:nowrap}
.filters{order:3;min-width:0;flex:1 0 100%;display:flex;gap:8px;overflow-x:auto;padding:3px 2px 5px;scrollbar-width:thin}
.fchip{display:flex;align-items:center;gap:7px;border:1.5px solid var(--ink);background:#fff;border-radius:3px;padding:3px 10px;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.fchip i{width:13px;height:13px;border:1.5px solid var(--ink);background:var(--c,#fff);flex:none}
.fchip:hover{background:var(--ink);color:#fff}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.bar>b{flex:1 1 auto}
#msg{font-size:12.5px;font-weight:600;color:var(--good);flex-basis:100%;text-align:right}
#msg:empty{display:none}
.dstat{font-size:13px;font-weight:600;border:1.5px dashed var(--ink);padding:1px 9px;background:#fff7d6;white-space:nowrap}
.dstat.yes{border-style:solid;background:#d9f2df}

.wrap{max-width:1100px;margin:0 auto;padding:0 20px 90px;overflow-x:clip}
@media (max-width:560px){.wrap{padding:0 12px 90px}.card{padding:14px 12px 12px}.sticky{width:100%}
  .bar{padding:6px 10px;gap:4px 8px}.bar>b{font-size:15px}.acts .btn{padding:2px 9px;font-size:13px}#printBtn{display:none}.acts{margin-left:0}html{scroll-padding-top:104px}}

/* hero */
.hero{padding:42px 0 14px;max-width:880px}
.hero h1{font-family:var(--hand);font-size:clamp(32px,5vw,52px);line-height:1.1;margin:0 0 14px}
.hero p{font-size:17px;color:var(--soft);max-width:68ch}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.stat{background:var(--paper);border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--ALL);padding:5px 12px;font-size:15px}
.stat b{font-family:var(--hand);font-size:16px;margin-right:6px}

/* panels */
.panel{background:var(--paper);border:1.5px solid var(--ink);box-shadow:4px 4px 0 var(--shadow);padding:16px 20px;margin:0 0 22px}
.panel h2{font-family:var(--hand);font-size:20px;margin:0 0 8px}
.panel p+p{margin-top:8px}
.panel ul{margin:6px 0 0;padding-left:20px}
.panel li{margin:4px 0;max-width:80ch}
dl.facts{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:0;font-size:15px}
dl.facts dt{font-weight:600;color:var(--soft)} dl.facts dd{margin:0}
@media (max-width:560px){dl.facts{grid-template-columns:1fr}}
.intro-row{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;margin:28px 0 8px}
.intro-row .panel{flex:1 1 360px;margin:0}
.tbc{display:inline-block;background:#fff;border:1.5px dashed var(--ink);font-size:11.5px;font-weight:500;padding:2px 8px;transform:rotate(2deg);margin-left:10px;vertical-align:middle}

/* sticky notes */
.sticky{position:relative;width:250px;min-height:96px;padding:22px 16px 16px;background:var(--c);transform:rotate(-1.2deg);
  box-shadow:0 12px 14px -9px rgba(31,41,51,.38),0 1px 0 rgba(31,41,51,.14);flex:none}
.sticky::before{content:"";position:absolute;left:50%;top:-11px;width:78px;height:22px;margin-left:-39px;background:rgba(255,255,255,.55);border:1px solid rgba(31,41,51,.10);transform:rotate(-2deg)}
.sticky b{display:block;font-family:var(--hand);font-size:21px;line-height:1.25}
.sticky span{display:block;margin-top:4px;font-size:13px;color:#2b3440}
.sticky.q{width:min(420px,100%);transform:rotate(-1deg)}
.sticky.q b{font-size:24px}

/* sections */
section.tool{margin-top:54px}
.shead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:26px;margin-bottom:26px}
.sgoal{max-width:62ch;font-size:16px;color:var(--soft);padding-bottom:6px}
.card{background:var(--paper);border:1.5px solid var(--ink);box-shadow:5px 5px 0 var(--c,var(--shadow));padding:18px 22px 18px;margin:0 0 26px}
.legend-list{list-style:none;margin:0 0 6px;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:8px 24px}
.legend-list li{display:flex;gap:10px;font-size:14.5px;align-items:flex-start}
.legend-list .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:1px}
.note{border-left:7px solid var(--c,var(--ink));background:#f6f8fa;border-top:1px solid #d5dde5;border-right:1px solid #d5dde5;border-bottom:1px solid #d5dde5;padding:8px 12px;margin:14px 0 0;font-size:14.5px}
.note b{display:block;font-family:var(--hand);font-size:15px;margin-bottom:2px}
.note ul{margin:4px 0 0;padding-left:18px}
.note.warn{background:#fff7d6}
.card h3,.h3{font-family:var(--hand);font-size:17px;margin:20px 0 8px}
details.txt{margin-top:14px;font-size:14px}
details.txt summary{cursor:pointer;color:var(--soft);width:max-content}
details.txt ul{margin:8px 0 0;padding-left:22px;max-width:100ch}
details.txt li{margin:3px 0}

/* controls */
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:10px 0}
label{font-weight:600}
input[type=text],input[type=number],input[type=date],textarea,select{background:#fff;border:1.5px solid var(--ink);border-radius:3px;padding:6px 9px;max-width:100%}
input[type=text]{width:100%;min-width:0}
textarea{width:100%;min-height:84px;resize:vertical;line-height:1.55}
.btn{border:1.5px solid var(--ink);background:#fff;border-radius:3px;padding:4px 14px;font-weight:600}
.btn:hover{background:#eef2f6}
.btn.solid{background:var(--ink);color:#fff}
.btn.solid:hover{background:#364452}
.btn.small{padding:1px 9px;font-size:13px}
.btn.danger{border-style:dashed;font-weight:500}
.scale{display:inline-flex;flex-wrap:wrap;gap:6px}
.scale button{min-width:42px;padding:3px 10px;border:1.5px solid var(--ink);background:#fff;border-radius:3px;font-weight:600}
.scale button:hover{background:#eef2f6}
.scale button[aria-pressed="true"]{background:var(--ink);color:#fff}
.muted{color:var(--soft)} .small{font-size:13px}
.scroll{overflow-x:auto}
table.grid{border-collapse:collapse;min-width:100%}
table.grid th,table.grid td{border:1.5px solid var(--ink);padding:6px 8px;vertical-align:top;text-align:left;background:#fff}
table.grid th{background:var(--c,#eef2f6);min-width:130px}
table.grid select{width:100%}

/* results */
.result{margin-top:16px;padding:12px 16px;background:#fff;border:1.5px solid var(--ink);border-left:7px solid var(--c,var(--ink));box-shadow:3px 3px 0 var(--shadow)}
.result>strong{font-family:var(--hand);font-size:16px}
.rank{margin:12px 0}
.rank .tagtop{font-size:11.5px;font-weight:600;background:var(--ink);color:#fff;padding:0 7px;margin-left:8px}
.meter{height:16px;border:1.5px solid var(--ink);background:#eef2f6;margin:5px 0 2px}
.meter>span{display:block;height:100%;background:var(--c,var(--MD));border-right:1.5px solid var(--ink)}

/* quadrants */
.quad{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
@media (max-width:640px){.quad,.cols{grid-template-columns:1fr!important}}
.cell{position:relative;background:#fff;border:1.5px solid var(--ink);box-shadow:4px 4px 0 var(--c);padding:12px 14px 8px 20px;min-height:140px}
.cell::before,.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--c);border-right:1.5px solid var(--ink)}
.cell h3{font-family:var(--hand);font-size:17px;margin:0;display:inline-block;border-bottom:4px solid var(--c)}
.cell .when{font-size:12.5px;color:var(--soft);margin-top:4px}
.cell .act{font-weight:600;font-size:14px;margin:4px 0 10px}
.item{position:relative;display:flex;gap:6px;align-items:center;background:#fff;border:1.5px solid var(--ink);box-shadow:2px 2px 0 var(--c,var(--ALL));padding:4px 6px 4px 16px;margin:0 0 8px}
.item>span{flex:1;overflow-wrap:anywhere;font-size:14.5px}
.item select{max-width:150px;padding:2px 4px;font-size:13px}
.item.free{--c:var(--ALL)}

/* two columns */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
.col{background:#fff;border:1.5px solid var(--ink);box-shadow:4px 4px 0 var(--c,var(--shadow));padding:12px 14px}
.col>h3{font-family:var(--hand);font-size:17px;margin:0 0 6px;display:inline-block;border-bottom:4px solid var(--c,var(--ink))}
.col .hint{font-size:12.5px;color:var(--soft);margin-bottom:6px}
.line{display:grid;grid-template-columns:1fr 78px auto;gap:6px;margin:6px 0;align-items:center}
.line.two{grid-template-columns:1fr auto}
.opt-card{position:relative;background:#fff;border:1.5px solid var(--ink);box-shadow:4px 4px 0 var(--c,var(--shadow));padding:12px 14px 12px 22px;margin-top:14px}
.opt-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--c,var(--ink));border-right:1.5px solid var(--ink)}

/* steps (guided) */
.step{position:relative;background:#fff;border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--c,var(--shadow));padding:11px 14px 11px 22px;margin:14px 0}
.step::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--c,var(--ink));border-right:1.5px solid var(--ink)}
.step .q{font-weight:600;margin-bottom:4px}
.sectionhead{margin:24px 0 0;font-family:var(--hand);font-size:18px;display:inline-block;border-bottom:4px solid var(--c,var(--ink))}
.opt{display:block;margin:6px 0;font-weight:500}.opt input{margin-right:8px}

/* flow chart */
.fleg{display:flex;flex-wrap:wrap;gap:12px 26px;margin-bottom:12px;font-size:14px}
.fleg div{display:flex;align-items:center;gap:9px}
.sw{width:54px;height:26px;border:1.5px solid var(--ink);flex:none}
.sw.start{background:var(--ink);border-radius:14px}
.sw.end{background:#d9f2df;border-radius:14px}
.sw.dec{border:0;background:var(--ink);clip-path:polygon(12% 0,88% 0,100% 50%,88% 100%,12% 100%,0 50%);position:relative}
.sw.dec::after{content:"";position:absolute;inset:1.5px;background:#fff1b8;clip-path:polygon(12% 0,88% 0,100% 50%,88% 100%,12% 100%,0 50%)}
.chain{display:flex;flex-direction:column;align-items:center;margin:8px 0}
.pill{border:1.5px solid var(--ink);border-radius:36px;padding:8px 22px;text-align:center;font-weight:500;max-width:620px}
.pill.start{background:var(--ink);color:#fff}
.pill.end{background:#d9f2df;text-align:left;border-radius:20px;padding:12px 22px;box-shadow:3px 3px 0 var(--shadow)}
.pill.end h3{margin:0 0 4px;font-size:18px}
.pill.end .ck::before{content:"\2713\00a0";font-weight:700}
.hexw{position:relative;max-width:680px;width:100%;padding:1.6px;background:var(--ink);clip-path:polygon(5% 0,95% 0,100% 50%,95% 100%,5% 100%,0 50%)}
.hexw.done{opacity:.7}
.hexin{background:#fff1b8;padding:14px 8%;text-align:center;font-weight:500;clip-path:polygon(5% 0,95% 0,100% 50%,95% 100%,5% 100%,0 50%)}
.hexin .help{font-weight:400;font-size:13px;color:#3a4651;margin-top:4px}
.arrow{position:relative;width:2px;height:34px;background:var(--ink);margin:0 auto}
.arrow::after{content:"";position:absolute;bottom:-1px;left:-5px;border:6px solid transparent;border-top:9px solid var(--ink);border-bottom:0}
.arrow .el{position:absolute;left:14px;top:50%;transform:translateY(-50%);background:#fff;border:1px solid #98a6b5;border-radius:2px;padding:0 6px;font-size:12px;font-weight:600;white-space:nowrap;max-width:70vw;overflow:hidden;text-overflow:ellipsis}
.choices{display:flex;flex-direction:column;gap:8px;align-items:stretch;max-width:620px;width:100%;margin:2px 0}
.choices .btn{text-align:left;padding:7px 14px}

/* final form */
.final .field{margin:14px 0}
.final .field>label{display:block;font-size:13px;color:var(--soft);margin-bottom:4px}
.decs{display:flex;flex-wrap:wrap;gap:8px}
.dbtn{border:1.5px solid var(--ink);background:#fff;padding:7px 16px;font-weight:600;font-size:14.5px;border-radius:3px}
.dbtn:hover{background:#eef2f6}
.dbtn[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink);background:#ffe9a8}
.dbtn.yes[aria-pressed="true"]{background:#d6f0dc}

/* drawer */
#drawer{position:fixed;right:0;top:0;bottom:0;z-index:80;width:min(500px,100vw);background:#fff;border-left:1.5px solid var(--ink);box-shadow:-8px 0 0 rgba(31,41,51,.12);overflow:auto;
  transform:translateX(104%);visibility:hidden;transition:transform .2s ease,visibility 0s .2s;padding:20px 24px 40px}
#drawer.open{transform:none;visibility:visible;transition:transform .2s ease}
#drawer .x{position:absolute;right:14px;top:12px}
#drawer .band{height:8px;background:var(--AD);border:1.5px solid var(--ink);width:90px;margin:0 0 12px}
#drawer h2{font-family:var(--hand);font-size:22px;margin:6px 0 6px}
#drawer textarea{min-height:300px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
@media (prefers-reduced-motion:reduce){#drawer,#drawer.open{transition:none}}
@media print{.bar,#drawer{display:none}body{background:#fff}.card,.panel{break-inside:avoid}.scale button:not([aria-pressed="true"]){display:none}}
</style>
</head>

      app.appendChild(h("div", { "class": "panel", id: "sec-why" }, h("h2", { text: T("why") }), h("p", { text: TS.why }), also.length ? h("div", null, h("p", { "class": "small muted", text: T("also") }), list(also)) : null));
    }

    CFG.tools.forEach(function (t, i) {
      var r = R[t.renderer], ts = state.tools[i], color = TOOLC[i % TOOLC.length];
      var sec = h("section", { "class": "tool", id: "sec-tool-" + i, style: "--c:" + colorVar(color) });
      sec.appendChild(h("div", { "class": "shead" },
        h("div", { "class": "sticky", style: "--c:" + colorVar(color) }, h("b", { text: t.title || t.preset }), h("span", { text: (i === 0 ? T("mainTool") : T("secondTool")) + (t.source ? " | " + t.source : "") })),
        t.intro ? h("p", { "class": "sgoal", text: t.intro }) : null));
      if (!r) { sec.appendChild(h("p", { text: T("brokenTool", { t: t.renderer }) })); app.appendChild(sec); return; }
      var card = h("div", { "class": "card", style: "--c:" + colorVar(color) });
      if (t.how && t.how.length) { card.appendChild(h("h3", { "class": "h3", style: "margin-top:0", text: T("how") })); card.appendChild(h("ul", { "class": "legend-list" }, t.how.map(function (x, n) { return h("li", null, h("span", { "class": "n", text: String(n + 1) }), h("span", { text: x })); }))); }
      var box = h("div"), txtBox = h("ul");
      function refreshText() {
        txtBox.textContent = "";
        var lines = r.summary(t, ts.main); if (t.prompts && t.prompts.length) lines = lines.concat(summarizeSteps(t.prompts, ts.prompts));
        lines.forEach(function (l) { txtBox.appendChild(h("li", { text: l.replace(/^- /, "") })); });
      }
      var ctx = { changed: function () { base.changed(); refreshText(); }, rerender: function () { r.render(box, t, ts.main, ctx); refreshText(); } };
      card.appendChild(box); r.render(box, t, ts.main, ctx);
      if (t.prompts && t.prompts.length) {
        card.appendChild(h("h3", { "class": "h3", text: t.promptsTitle || T("think") }));
        var pb = h("div"); card.appendChild(pb); renderSteps(pb, t.prompts, ts.prompts, ctx, t.promptRules);
      }
      if (t.readout) card.appendChild(note(T("readout"), h("p", { text: t.readout })));
      card.appendChild(h("details", { "class": "txt" }, h("summary", { text: T("asText") }), txtBox)); refreshText();
      sec.appendChild(card); app.appendChild(sec);
    });

    app.appendChild(renderFinal());
    var notes = (CFG.notes && CFG.notes.length) ? CFG.notes : [T("defaultNote")];
    app.appendChild(h("section", { "class": "tool", id: "sec-notes" }, h("div", { "class": "panel" }, h("h2", { text: T("notes") }), list(notes))));
    refreshDatalist(); refreshChip();
  }

  /* ---------- drawer (summary) ---------- */
  var drawer = document.getElementById("drawer");
  function openDrawer() {
    lastFocus = document.activeElement;
    drawer.textContent = "";
    drawer.appendChild(h("button", { type: "button", "class": "btn x", text: T("close"), onclick: closeDrawer }));
    drawer.appendChild(h("div", { "class": "band" }));
    drawer.appendChild(h("h2", { id: "dtitle", text: T("sumTitle") }));
    var ta = h("textarea", { id: "summary-text", readonly: true, "aria-label": T("sumTitle") }); ta.value = buildSummary();
    drawer.appendChild(ta);
    drawer.appendChild(h("div", { "class": "row" }, btn(T("copy"), copyText, "solid")));
    drawer.classList.add("open"); drawer.setAttribute("aria-hidden", "false");
    drawer.querySelector(".x").focus();
  }
  function closeDrawer() { drawer.classList.remove("open"); drawer.setAttribute("aria-hidden", "true"); if (lastFocus && lastFocus.focus) lastFocus.focus(); }
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && drawer.classList.contains("open")) closeDrawer(); });
  function copyText() {
    var ta = document.getElementById("summary-text"); ta.focus(); ta.select();
    var done = false;
    try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(ta.value); done = true; } } catch (e) { /* fall through */ }
    if (!done) { try { done = document.execCommand("copy"); } catch (e) { done = false; } }
    say(done ? T("copied") : T("copySel"));
  }

  function slug() { return (CFG.meta.id || (CFG.meta.title || "decision").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "decision"); }
  function save() {
    persist();
    var payload = { app: "decision-tool-builder", version: 2, savedAt: new Date().toISOString(), meta: CFG.meta, state: state };
    var name = "decision-" + slug() + "-" + new Date().toISOString().slice(0, 10) + ".json", ok = false;
    try {
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" }), url = URL.createObjectURL(blob);
      var a = h("a", { href: url, download: name }); document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 1500); ok = true;
    } catch (e) { ok = false; }
    say(ok ? T("savedFile", { name: name }) : T("savedBrowser"));
    openDrawer();
  }
  function load(file) {
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var p = JSON.parse(fr.result);
        if (!p || p.app !== "decision-tool-builder" || !p.state) throw new Error("bad file");
        initState(p.state); render(); renderBar(); say(T("loaded"));
      } catch (e) { say(T("loadFail")); }
    };
    fr.readAsText(file);
  }
  function start() {
    var restored = null;
    try { var raw = localStorage.getItem(STORE_KEY); if (raw) { var p = JSON.parse(raw); if (p && p.app === "decision-tool-builder") restored = p.state; } } catch (e) { restored = null; }
    initState(null); render(); renderBar();
    if (restored) {
      var b = h("div", { "class": "panel", role: "status" }, h("h2", { text: T("found") }),
        h("div", { "class": "row" }, btn(T("restore"), function () { initState(restored); render(); renderBar(); say(T("restored")); }, "solid"), btn(T("fresh"), function () { try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ } b.remove(); })));
      app.insertBefore(b, app.firstChild);
    }
  }
  window.__dtb = { R: R, state: function () { return state; }, summary: buildSummary };
  start();
})();
</script>
